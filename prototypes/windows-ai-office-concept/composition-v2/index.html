<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Windows AI オフィス構想 v2（pro テーマ・コンセプト）</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Fonts: subset woff2 files shipped in assets/fonts (no build-time fetch). */
      @font-face {
        font-family: "Zen Kaku Gothic New";
        font-weight: 700;
        src: url("assets/fonts/zen-kaku-gothic-new-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Zen Kaku Gothic New";
        font-weight: 900;
        src: url("assets/fonts/zen-kaku-gothic-new-900.woff2") format("woff2");
      }
      @font-face {
        font-family: "Noto Sans JP";
        font-weight: 400;
        src: url("assets/fonts/noto-sans-jp-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Noto Sans JP";
        font-weight: 700;
        src: url("assets/fonts/noto-sans-jp-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        src: url("assets/fonts/jetbrains-mono-700.woff2") format("woff2");
      }
      /* pro theme tokens (character-explainer-video theme.ts), 1920 -> 1280 = x2/3 */
      :root {
        --bg: #0c1c2e;
        --bg2: #143350;
        --panel: #16293d;
        --panel2: #1d3550;
        --ink: #f4f8fc;
        --muted: #9fb4c8;
        --on-accent: #0c1c2e;
        --accent: #f2a03d;
        --emphasis: #ff7a33;
        --good: #2fbf71;
        --bad: #e5484d;
        --info: #3e8fe0;
        --info-ink: #6fb6e8; /* pro code.func: info hue lightened for text contrast */
        --special: #9b7be0;
        --line: rgba(255, 255, 255, 0.1);
        --r-sm: 5px;
        --r-md: 9px;
        --r-lg: 13px;
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
        --safe: 80px;
        --gap: 32px;
        --pad: 37px;
        --display: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
        --body: "Noto Sans JP", sans-serif;
        --mono: "JetBrains Mono", "Noto Sans JP", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--bg);
      }
      #film {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
      }
      .mono {
        font-family: var(--mono);
      }
      .display {
        font-family: var(--display);
      }
    </style>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1280"
      data-height="720"
    >
      <!-- Scene windows are the only timing that narration would change: re-time these
           data-start / data-duration values to the measured voice track (see README). -->
      <div id="bg-slot" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="15" data-track-index="0" data-width="1280" data-height="720"></div>
      <div id="scene1-slot" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0" data-duration="5" data-track-index="1" data-width="1280" data-height="720"></div>
      <div id="scene2-slot" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="5" data-duration="5" data-track-index="1" data-width="1280" data-height="720"></div>
      <div id="scene3-slot" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="10" data-duration="5" data-track-index="1" data-width="1280" data-height="720"></div>
      <div id="chrome-slot" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-duration="15" data-track-index="2" data-width="1280" data-height="720"></div>
      <!-- Audio slot (track 3), intentionally empty in this silent version. -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
