<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>bg</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: var(--bg);
        }
        /* pro bgGrad is a full-frame linear gradient; H.264 bands those on dark
           grounds, so the same two tones are laid as solid + radial glow instead. */
        .glow {
          position: absolute;
          left: 380px;
          top: -260px;
          width: 1100px;
          height: 1100px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(20, 51, 80, 0.95) 0%, rgba(20, 51, 80, 0) 62%);
        }
        .grid {
          position: absolute;
          inset: 0;
          background-image:
            repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 40px),
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 40px);
        }
        .orbit {
          position: absolute;
          right: -170px;
          bottom: -230px;
          display: block;
          width: 620px;
          height: 620px;
        }
      </style>
      <div id="root" data-composition-id="bg" data-width="1280" data-height="720">
        <div id="glow" class="glow"></div>
        <div class="grid"></div>
        <svg id="orbit" class="orbit" viewBox="0 0 620 620">
          <circle cx="310" cy="310" r="290" fill="none" stroke="rgba(242,160,61,0.22)" stroke-width="3" stroke-dasharray="3 22" />
          <circle cx="310" cy="310" r="230" fill="none" stroke="rgba(62,143,224,0.22)" stroke-width="2" />
          <circle cx="310" cy="20" r="9" fill="rgba(242,160,61,0.55)" />
        </svg>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#glow", { scale: 0.92, opacity: 0.85 }, { scale: 1.06, opacity: 1, duration: 7.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#orbit", { rotation: 0 }, { rotation: 90, duration: 15, ease: "none", transformOrigin: "50% 50%" }, 0);
        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
