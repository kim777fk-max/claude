<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>scene2</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .wrap {
          position: absolute;
          left: 0;
          top: 84px;
          width: 100%;
          height: 552px;
          padding: 0 var(--safe);
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: var(--gap);
        }
        .right {
          width: 470px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .kicker {
          font-family: var(--mono);
          font-size: 17px;
          font-weight: 700;
          color: var(--info-ink);
          letter-spacing: 0.12em;
        }
        .headline {
          font-family: var(--display);
          font-size: 44px;
          font-weight: 900;
          line-height: 1.3;
        }
        .hl {
          display: block;
          white-space: nowrap;
        }
        .loader {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 44px;
        }
        .spinner {
          display: block;
          width: 38px;
          height: 38px;
        }
        .status-stack {
          position: relative;
          width: 400px;
          height: 36px;
        }
        .status {
          position: absolute;
          left: 0;
          top: 0;
          font-size: 22px;
          font-weight: 700;
          color: var(--info-ink);
          white-space: nowrap;
        }
        .status.fin {
          color: var(--good);
        }
        .card {
          width: 580px;
          background: var(--panel);
          border: 2px solid var(--line);
          border-radius: var(--r-lg);
          box-shadow: var(--shadow-md);
          padding: 24px var(--pad) 28px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .card-title {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          font-family: var(--display);
          font-size: 22px;
          font-weight: 900;
          padding-bottom: 8px;
          border-bottom: 2px solid var(--line);
        }
        .card-title .mono {
          font-family: var(--mono);
          font-size: 16px;
          font-weight: 700;
          color: var(--muted);
        }
        .row {
          display: flex;
          align-items: center;
          gap: 14px;
          height: 62px;
          padding: 0 14px;
          border-radius: var(--r-md);
          background: var(--panel2);
        }
        .badge {
          position: relative;
          flex: 0 0 36px;
          width: 36px;
          height: 36px;
        }
        .num,
        .ck {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: var(--mono);
          font-size: 17px;
          font-weight: 700;
        }
        .num {
          border: 2px solid var(--info-ink);
          color: var(--info-ink);
        }
        .ck {
          background: var(--good);
          color: var(--on-accent);
        }
        .task {
          flex: 1;
          display: flex;
          flex-direction: column;
        }
        .task-name {
          font-size: 20px;
          font-weight: 700;
        }
        .task-from {
          font-size: 16px;
          color: var(--muted);
        }
        .due {
          font-family: var(--mono);
          font-size: 16px;
          font-weight: 700;
          color: var(--accent);
          border: 2px solid var(--accent);
          border-radius: 999px;
          padding: 3px 12px;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="scene2" data-width="1280" data-height="720">
        <div id="s2" class="wrap">
          <div id="result" class="card">
            <div class="card-title"><span>抽出結果（例）</span><span class="mono">18:00</span></div>
            <div class="row r">
              <div class="badge"><span class="num">1</span><span class="ck">✓</span></div>
              <div class="task"><span class="task-name">見積を送付する</span><span class="task-from">取引先Aから</span></div>
              <span class="due">明日 午前</span>
            </div>
            <div class="row r">
              <div class="badge"><span class="num">2</span><span class="ck">✓</span></div>
              <div class="task"><span class="task-name">会議室を予約する</span><span class="task-from">店舗Cから</span></div>
              <span class="due">木曜</span>
            </div>
            <div class="row r">
              <div class="badge"><span class="num">3</span><span class="ck">✓</span></div>
              <div class="task"><span class="task-name">資料を修正する</span><span class="task-from">社内Bから</span></div>
              <span class="due">金曜 17:00</span>
            </div>
            <div class="row r">
              <div class="badge"><span class="num">4</span><span class="ck">✓</span></div>
              <div class="task"><span class="task-name">請求書を確認する</span><span class="task-from">経理Dから</span></div>
              <span class="due">月末</span>
            </div>
          </div>
          <div class="right">
            <div id="s2-kicker" class="kicker">STEP 2 ／ 抽出</div>
            <div id="s2-head" class="headline"><span class="hl">依頼と期限だけを</span><span class="hl">抜き出す</span></div>
            <div class="loader">
              <svg id="spinner" class="spinner" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="16" fill="none" stroke="#1d3550" stroke-width="5" />
                <path d="M20 4 A16 16 0 0 1 36 20" fill="none" stroke="#3e8fe0" stroke-width="5" stroke-linecap="round" />
              </svg>
              <div class="status-stack">
                <span id="st1" class="status">メッセージを読み取り中…</span>
                <span id="st2" class="status">依頼かどうかを判定中…</span>
                <span id="st3" class="status fin">整理完了：依頼 4件</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // enter from the right (continues scene 1's leftward exit)
        tl.fromTo("#s2", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);
        tl.fromTo("#s2-kicker", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1);
        tl.fromTo("#s2-head", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo("#spinner", { rotation: 0 }, { rotation: 1080, duration: 3.0, ease: "none", transformOrigin: "50% 50%" }, 0.3);
        tl.to("#spinner", { opacity: 0.2, duration: 0.2 }, 3.3);
        tl.fromTo("#st1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, 0.35);
        tl.to("#st1", { opacity: 0, y: -10, duration: 0.2 }, 1.6);
        tl.fromTo("#st2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, 1.7);
        tl.to("#st2", { opacity: 0, y: -10, duration: 0.2 }, 3.1);
        tl.fromTo("#st3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 3.25);
        tl.fromTo("#result", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 0.3);
        tl.fromTo(".r", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.35 }, 0.9);
        tl.to(".num", { opacity: 0, scale: 0.6, duration: 0.2, stagger: 0.28 }, 3.2);
        tl.fromTo(".ck", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.28 }, 3.2);
        // exit: shrink toward the centre (scene 3 is centred)
        tl.to("#s2", { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in" }, 4.7);
        window.__timelines["scene2"] = tl;
      </script>
    </template>
  </body>
</html>
