<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>scene1</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .wrap {
          position: absolute;
          left: 0;
          top: 84px;
          width: 100%;
          height: 552px;
          padding: 0 var(--safe);
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: var(--gap);
        }
        .left {
          width: 500px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .kicker {
          font-family: var(--mono);
          font-size: 17px;
          font-weight: 700;
          color: var(--accent);
          letter-spacing: 0.12em;
        }
        .clock-box {
          position: relative;
          width: 420px;
          height: 118px;
        }
        .clock {
          position: absolute;
          left: 0;
          top: 0;
          font-family: var(--mono);
          font-size: 112px;
          font-weight: 700;
          line-height: 1;
          color: var(--ink);
        }
        .clock.now {
          color: var(--accent);
        }
        .headline {
          font-family: var(--display);
          font-size: 44px;
          font-weight: 900;
          line-height: 1.3;
        }
        .hl {
          display: block;
          white-space: nowrap;
        }
        .chat {
          width: 520px;
          height: 470px;
          background: var(--panel);
          border: 2px solid var(--line);
          border-radius: var(--r-lg);
          box-shadow: var(--shadow-md);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .chat-head {
          flex: 0 0 56px;
          height: 56px;
          background: var(--panel2);
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 22px;
          font-size: 19px;
          font-weight: 700;
        }
        .dot {
          display: block;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--good);
        }
        .ex {
          margin-left: auto;
          font-size: 16px;
          color: var(--muted);
        }
        .chat-body {
          position: relative;
          flex: 1;
          overflow: hidden;
        }
        .feed {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          padding: 16px 20px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .msg {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .who {
          font-size: 16px;
          color: var(--muted);
        }
        .bubble {
          position: relative;
          display: block;
          width: 412px;
          font-size: 19px;
          line-height: 1.45;
          background: var(--panel2);
          border: 2px solid transparent;
          border-radius: var(--r-md);
          padding: 9px 15px;
        }
        .tag {
          position: absolute;
          right: -58px;
          top: 9px;
          display: block;
          width: 50px;
          text-align: center;
          font-size: 16px;
          font-weight: 700;
          color: var(--on-accent);
          background: var(--accent);
          border-radius: var(--r-sm);
          padding: 2px 0;
        }
      </style>
      <div id="root" data-composition-id="scene1" data-width="1280" data-height="720">
        <div id="s1" class="wrap">
          <div class="left">
            <div id="s1-kicker" class="kicker">STEP 1 ／ 夕方の確認</div>
            <div class="clock-box">
              <span id="c1" class="clock">17:58</span>
              <span id="c2" class="clock">17:59</span>
              <span id="c3" class="clock now">18:00</span>
            </div>
            <div id="s1-head" class="headline"><span class="hl">LINEの業務連絡を</span><span class="hl">AIがまとめて確認</span></div>
          </div>
          <div id="chat" class="chat">
            <div class="chat-head"><span class="dot"></span><span>LINE｜業務連絡トーク</span><span class="ex">表示は架空の例</span></div>
            <div class="chat-body">
              <div id="feed" class="feed" data-layout-allow-overflow>
                <div class="msg m m1"><span class="who">取引先A</span><span class="bubble b">明日の午前中に見積をいただけますか？<span class="tag">依頼</span></span></div>
                <div class="msg m m2"><span class="who">社内B</span><span class="bubble">了解です、共有ありがとうございます</span></div>
                <div class="msg m"><span class="who">店舗C</span><span class="bubble b">木曜の会議室、予約をお願いします<span class="tag">依頼</span></span></div>
                <div class="msg m"><span class="who">社内B</span><span class="bubble b">資料の修正、金曜17時までにお願いします<span class="tag">依頼</span></span></div>
                <div class="msg m"><span class="who">取引先A</span><span class="bubble">いつもありがとうございます</span></div>
                <div class="msg m"><span class="who">経理D</span><span class="bubble b">請求書の確認を月末までにお願いします<span class="tag">依頼</span></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
        // clock ticks over to 18:00 (discrete swaps)
        tl.fromTo("#c1", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
        tl.to("#c1", { opacity: 0, duration: 0.01 }, 0.45);
        tl.fromTo("#c2", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.45);
        tl.to("#c2", { opacity: 0, duration: 0.01 }, 0.8);
        tl.fromTo("#c3", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "0% 50%" }, 0.8);
        tl.fromTo("#s1-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);
        tl.fromTo("#chat", { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.55, ease: "power4.out" }, 0.25);
        tl.fromTo(".m", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.24 }, 0.6);
        tl.fromTo("#feed", { y: 0 }, { y: -150, duration: 0.9, ease: "power3.inOut" }, 2.2);
        tl.to(".m1, .m2", { opacity: 0, duration: 0.45, ease: "power1.in" }, 2.25);
        // hinge: requests get outlined in amber, tags pop
        tl.to(".b", { borderColor: "#f2a03d", duration: 0.25, stagger: 0.18 }, 3.2);
        tl.fromTo(".tag", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", stagger: 0.18 }, 3.25);
        // exit: slide left (next scene enters from the right)
        tl.to("#s1", { opacity: 0, x: -60, duration: 0.35, ease: "power2.in" }, 4.65);
        window.__timelines["scene1"] = tl;
      </script>
    </template>
  </body>
</html>
