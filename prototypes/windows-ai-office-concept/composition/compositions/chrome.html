<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>chrome</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        /* ---------- persistent chrome ---------- */
        .topbar {
        position: absolute;
        left: 48px;
        right: 48px;
        top: 24px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        }
        .brand {
        display: flex;
        align-items: baseline;
        gap: 14px;
        }
        .brand-name {
        font-size: 22px;
        font-weight: 700;
        }
        .brand-tag {
        font-size: 16px;
        color: var(--ai);
        letter-spacing: 0.08em;
        }
        .concept-badge {
        font-size: 17px;
        font-weight: 700;
        color: #8a2d12;
        background: #fbe7dc;
        border: 2px solid #8a2d12;
        border-radius: 999px;
        padding: 6px 18px;
        }
        .steps {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        display: flex;
        justify-content: center;
        gap: 14px;
        }
        .step {
        font-size: 17px;
        font-weight: 700;
        color: var(--muted);
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 6px 20px;
        }


      </style>
      <div id="root" data-composition-id="chrome" data-width="1280" data-height="720">
        <div class="topbar">
        <div class="brand">
        <span class="brand-name">Windows AI オフィス構想</span>
        <span class="brand-tag mono">CONCEPT</span>
        </div>
        <span class="concept-badge">コンセプト｜実在のサービスではありません</span>
        </div>
        <div class="steps">
        <span id="step1" class="step">① 18:00 確認</span>
        <span id="step2" class="step">② 依頼・期限を抽出</span>
        <span id="step3" class="step">③ 翌朝の朝会へ</span>
        </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const AI = "#2f4fc4";
        const CARD = "#fffdf8";
        const MUTED = "#4a5263";
        // ---- step indicator ----
        const stepOn = { backgroundColor: AI, color: "#ffffff", borderColor: AI, duration: 0.3 };
        const stepOff = { backgroundColor: CARD, color: MUTED, borderColor: "#d9d5c8", duration: 0.3 };
        tl.to("#step1", stepOn, 0);
        tl.to("#step1", stepOff, 5);
        tl.to("#step2", stepOn, 5);
        tl.to("#step2", stepOff, 10);
        tl.to("#step3", stepOn, 10);

        window.__timelines["chrome"] = tl;
      </script>
    </template>
  </body>
</html>
