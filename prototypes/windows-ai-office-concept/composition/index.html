<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Windows AI オフィス構想（コンセプト）</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #f3f1ea;
        --ink: #1b2230;
        --muted: #4a5263;
        --line: #d9d5c8;
        --card: #fffdf8;
        --ai: #2f4fc4;
        --ai-soft: #e3e8fb;
        --done: #17784c;
        --chat: #0a7a3e;
        --chat-soft: #e2f3e8;
        --mark: #fff0b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--bg);
      }
      #film {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans JP", sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }

          </style>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1280"
      data-height="720"
    >
      <div
        id="bg-slot"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="scene1-slot"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="scene2-slot"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="scene3-slot"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="10"
        data-duration="5"
        data-track-index="1"
        data-width="1280"
        data-height="720"
      ></div>
      <div
        id="chrome-slot"
        data-composition-id="chrome"
        data-composition-src="compositions/chrome.html"
        data-start="0"
        data-duration="15"
        data-track-index="2"
        data-width="1280"
        data-height="720"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
